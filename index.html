<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZenChat</title>

<style>
:root{
--g:#147a54;--g2:#0d6041;--o:#e58a3a;
--ink:#1d2822;--muted:#7b857e;
--line:#e7ece8;--bg:#f9fbf9
}
*{box-sizing:border-box}
html,body{
margin:0;width:100%;height:100%;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);color:var(--ink)
}
body{overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
header{
height:70px;flex-shrink:0;display:flex;
align-items:center;justify-content:space-between;
padding:0 22px;border-bottom:1px solid var(--line);
background:rgba(255,255,255,.94);
backdrop-filter:blur(16px)
}
.brand{font-size:24px;font-weight:800;letter-spacing:-1.2px}
.zen{color:var(--o)}
.chat{color:var(--g)}
.iconbtn,.pillbtn{
border:1px solid var(--line);background:white;
color:#34423a;border-radius:14px;cursor:pointer;
font:inherit;transition:all .18s ease
}
.iconbtn{width:42px;height:42px;font-size:19px}
.pillbtn{padding:10px 13px;font-size:13px;font-weight:650}
main{
flex:1;min-height:0;overflow:auto;display:flex;
flex-direction:column;padding:22px 18px 12px
}
.welcome{
margin:auto;text-align:center;max-width:660px;padding:30px 0
}
.welcome h1{
font-size:clamp(30px,6vw,46px);
letter-spacing:-1.8px;margin:0 0 12px;font-weight:760
}
.welcome h1 span{color:var(--g)}
.welcome p{color:var(--muted);font-size:15px;margin:0 0 26px}
.suggestions{
display:flex;flex-wrap:wrap;justify-content:center;gap:9px
}
.suggestions button{
border:1px solid var(--line);background:#fff;
border-radius:999px;padding:12px 17px;color:#455249;
cursor:pointer;font-size:13px;transition:all .2s
}
.suggestions button:hover{
border-color:#c7ddce;background:#f5faf6;color:var(--g)
}
.messages{
width:100%;max-width:820px;margin:0 auto;
display:flex;flex-direction:column;gap:18px
}
.msg{
max-width:90%;padding:14px 16px;border-radius:20px;
line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere
}
.user{
align-self:flex-end;background:#edf6f0;
border:1px solid #dcebe1
}
.assistant{
align-self:flex-start;background:white;
border:1px solid var(--line);
box-shadow:0 3px 14px #172d1a05
}
.typing{color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{
width:5px;height:5px;background:var(--g);
border-radius:50%;animation:pulse .75s infinite alternate
}
.dot:nth-child(2){animation-delay:.18s}
.dot:nth-child(3){animation-delay:.36s}
@keyframes pulse{to{opacity:.2;transform:translateY(-3px)}}
.composerWrap{
padding:10px 14px max(14px,env(safe-area-inset-bottom));
background:linear-gradient(transparent,var(--bg) 25%);
flex-shrink:0
}
.composer{
max-width:850px;margin:auto;background:white;
border:1px solid #e1e9e2;border-radius:26px;
box-shadow:0 12px 36px rgba(24,59,37,.07);
padding:12px;display:flex;flex-direction:column;gap:8px
}
.tools{display:flex;align-items:center;gap:7px}
.tool{
border:0;background:#f5f8f5;color:#58645b;
border-radius:10px;padding:8px 11px;
cursor:pointer;font-size:13px
}
.inputrow{display:flex;align-items:flex-end;gap:8px}
.inputrow textarea{
flex:1;resize:none;border:0;outline:0;
background:transparent;font:inherit;font-size:16px;
line-height:1.4;max-height:150px;min-height:42px;
padding:10px 8px
}
.send{
border:0;border-radius:15px;background:var(--g);
color:white;cursor:pointer;font-size:13px;
font-weight:700;padding:0 8px;width:auto;
min-width:58px;height:44px
}
.send:disabled{opacity:.45}
.tool:hover,.pillbtn:hover,.iconbtn:hover{
background:#f5faf6;border-color:#d3e4d8
}
.hint{text-align:center;color:#9aa39c;font-size:11px;margin:8px 0 0}
.side{
position:fixed;inset:0;background:#0004;
z-index:5;display:none
}
.side.open{display:block}
.drawer{
height:100%;width:min(300px,85vw);background:white;
padding:20px;box-shadow:12px 0 40px #0001
}
.drawerhead{
display:flex;justify-content:space-between;
align-items:center;margin-bottom:18px
}
.newchat{
width:100%;padding:13px;border:1px solid #dce8df;
background:#f4faf6;color:var(--g);
border-radius:13px;font-weight:650;cursor:pointer
}
.history{margin-top:15px;display:flex;flex-direction:column;gap:7px}
.history button{
border:0;background:#f8faf8;padding:12px;
border-radius:11px;text-align:left;color:#49544c;
cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
#preview{display:none;color:var(--g);font-size:12px;padding-left:4px}

@media(min-width:700px){
header{padding:0 28px}
main{padding:30px 28px 15px}
.composerWrap{padding-left:28px;padding-right:28px}
}

/* Pantalla de API KEY */
#apiScreen{
position:fixed;inset:0;z-index:100;
background:var(--bg);
display:flex;align-items:center;
justify-content:center;padding:24px
}
.apiBox{
width:100%;max-width:390px;
display:flex;flex-direction:column;gap:14px
}
.apiBox input{
width:100%;padding:16px;
border:1px solid #e2e9e3;border-radius:14px;
font-size:15px;outline-color:var(--g);
background:white;color:var(--ink)
}
.apiBox button{
padding:15px;border:0;border-radius:14px;
background:var(--g);color:white;
font-weight:700;font-size:15px;cursor:pointer
}
.apiBox button:disabled{opacity:.6}
#apiError{
color:#c0392b;font-size:13px;text-align:center;
min-height:16px
}
</style>
</head>

<body>

<!-- Pantalla inicial -->
<div id="apiScreen">
  <div class="apiBox">
    <input
      id="apiInput"
      type="password"
      placeholder="Introduce tu API Key..."
      autocomplete="off"
    >
    <button id="connectBtn">Conectar</button>
    <div id="apiError"></div>
  </div>
</div>

<div class="app" id="app" style="display:none">

<header>
<button class="iconbtn" id="menu" aria-label="Historial">≡</button>
<div class="brand">
<span class="zen">Zen</span><span class="chat">Chat</span>
</div>
<button class="pillbtn" id="imageMode">Crear imagen</button>
</header>

<main id="main">
<section class="welcome" id="welcome">
<h1>¿En qué puedo <span>ayudarte?</span></h1>
<p>Ideas, respuestas y creatividad en un solo lugar.</p>
<div class="suggestions">
<button data-prompt="Explícame un tema paso a paso">Aprender algo</button>
<button data-prompt="Dame ideas creativas para un proyecto">Crear ideas</button>
<button data-prompt="Ayúdame a resolver este problema">Resolver algo</button>
</div>
</section>
<div class="messages" id="messages"></div>
</main>

<div class="composerWrap">
<div class="composer">
<div class="tools">
<button class="tool" id="format"><b>*</b> Formato</button>
<button class="tool" id="attach">Adjuntar imagen</button>
<span id="preview"></span>
<input type="file" id="file" accept="image/*" hidden>
</div>
<div class="inputrow">
<textarea id="prompt" rows="1" placeholder="Escribe un mensaje..."></textarea>
<button class="send" id="send">Enviar</button>
</div>
</div>
<p class="hint">ZenChat puede cometer errores. Verifica la información importante.</p>
</div>
</div>

<div class="side" id="side">
<div class="drawer">
<div class="drawerhead">
<b>Conversaciones</b>
<button class="iconbtn" id="closeSide">✕</button>
</div>
<button class="newchat" id="newchat">+ Nuevo chat</button>
<div class="history" id="history"></div>
</div>
</div>

<script>
let API_KEY = "";
const MODEL = "gemini-2.5-flash";

const $ = id => document.getElementById(id);

let chats = JSON.parse(localStorage.getItem("zenchat_chats") || "[]");
let current = null;
let attached = null;
let imageMode = false;
let busy = false;

/* Conectar API */
$("connectBtn").onclick = connectAPI;

$("apiInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") connectAPI();
});

async function connectAPI(){
  const key = $("apiInput").value.trim();
  const error = $("apiError");
  const button = $("connectBtn");

  if(!key){
    error.textContent="Introduce tu API Key.";
    return;
  }

  button.disabled=true;
  button.textContent="Conectando...";
  error.textContent="";

  try{
    const response=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(key)}`,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{
            parts:[{text:"Responde solamente: Conexión correcta."}]
          }]
        })
      }
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error?.message || "No se pudo conectar.");
    }

    API_KEY=key;
    $("apiScreen").style.display="none";
    $("app").style.display="flex";

  }catch(e){
    error.textContent="No se pudo conectar. Revisa tu API Key.";
  }finally{
    button.disabled=false;
    button.textContent="Conectar";
  }
}

/* Chats */
function save(){
  localStorage.setItem("zenchat_chats",JSON.stringify(chats));
  renderHistory();
}

function newChat(){
  current={id:Date.now(),title:"Nuevo chat",messages:[]};
  chats.unshift(current);
  save();
  render();
  $("side").classList.remove("open");
}

function ensure(){
  if(!current){
    current={id:Date.now(),title:"Nuevo chat",messages:[]};
    chats.unshift(current);
  }
}

function render(){
  const box=$("messages");
  box.innerHTML="";
  $("welcome").style.display=
    current&&current.messages.length?"none":"block";

  if(current){
    current.messages.forEach(m=>{
      let d=document.createElement("div");
      d.className="msg "+(m.role==="user"?"user":"assistant");
      d.textContent=m.text;
      box.appendChild(d);
    });
  }
  $("main").scrollTop=$("main").scrollHeight;
}

function renderHistory(){
  let h=$("history");
  h.innerHTML="";
  chats.forEach(c=>{
    let b=document.createElement("button");
    b.textContent=c.title||"Chat";
    b.onclick=()=>{
      current=c;
      render();
      $("side").classList.remove("open");
    };
    h.appendChild(b);
  });
}

function addMsg(role,text){
  current.messages.push({role,text});
  if(current.title==="Nuevo chat"&&role==="user"){
    current.title=text.slice(0,35);
  }
  save();
  render();
}

function typing(){
  let d=document.createElement("div");
  d.className="msg assistant typing";
  d.id="typing";
  d.innerHTML='<span>ZenChat está respondiendo</span><i class="dot"></i><i class="dot"></i><i class="dot"></i>';
  $("messages").appendChild(d);
  $("main").scrollTop=$("main").scrollHeight;
}

/* Controles */
$("format").onclick=()=>{
  let t=$("prompt");
  let a=t.selectionStart;
  let b=t.selectionEnd;
  let s=t.value;
  t.value=s.slice(0,a)+"**"+s.slice(a,b||a)+"**"+s.slice(b);
  t.focus();
  t.setSelectionRange(a+2,b+2);
};

$("menu").onclick=()=>$("side").classList.add("open");
$("closeSide").onclick=()=>$("side").classList.remove("open");

$("side").onclick=e=>{
  if(e.target===$("side"))$("side").classList.remove("open");
};

$("newchat").onclick=newChat;

$("attach").onclick=()=>$("file").click();

$("file").onchange=e=>{
  attached=e.target.files[0];
  $("preview").style.display="inline";
  $("preview").textContent=attached?"Imagen: "+attached.name:"";
};

$("imageMode").onclick=()=>{
  imageMode=!imageMode;
  $("imageMode").style.background=imageMode?"#eaf5ef":"white";
  $("prompt").placeholder=imageMode
    ?"Describe la imagen que quieres crear..."
    :"Escribe un mensaje...";
};

document.querySelectorAll("[data-prompt]").forEach(b=>{
  b.onclick=()=>{
    $("prompt").value=b.dataset.prompt;
    send();
  };
});

$("prompt").addEventListener("input",()=>{
  $("prompt").style.height="auto";
  $("prompt").style.height=Math.min($("prompt").scrollHeight,150)+"px";
});

$("prompt").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
});

$("send").onclick=send;

/* Enviar mensajes */
async function send(){
  if(busy)return;

  let text=$("prompt").value.trim();
  if(!text&&!attached)return;

  ensure();

  let file=attached;
  addMsg("user",text+(file?" [Imagen adjunta]":""));

  $("prompt").value="";
  $("prompt").style.height="auto";
  attached=null;
  $("preview").style.display="none";
  $("file").value="";

  busy=true;
  $("send").disabled=true;
  typing();

  try{
    let parts=[{
      text:imageMode
        ?"Describe una propuesta visual para esta solicitud: "+text
        :text
    }];

    if(file){
      let data=await new Promise((res,rej)=>{
        let r=new FileReader();
        r.onload=()=>res(r.result.split(",")[1]);
        r.onerror=rej;
        r.readAsDataURL(file);
      });

      parts.push({
        inline_data:{
          mime_type:file.type,
          data:data
        }
      });
    }

    let prior=current.messages.slice(0,-1).map(m=>({
      role:m.role==="assistant"?"model":"user",
      parts:[{text:m.text}]
    }));

    let response=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(API_KEY)}`,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[...prior,{role:"user",parts}],
          generationConfig:{temperature:.7}
        })
      }
    );

    let data=await response.json();

    if(!response.ok){
      throw Error(data.error?.message||"Error de API");
    }

    let answer=data.candidates?.[0]?.content?.parts
      ?.map(p=>p.text||"").join("")
      ||"No recibí una respuesta.";

    $("typing")?.remove();
    addMsg("assistant",answer);

  }catch(err){
    $("typing")?.remove();
    addMsg("assistant","Error: "+err.message);
  }finally{
    busy=false;
    $("send").disabled=false;
    imageMode=false;
    $("imageMode").style.background="white";
    $("prompt").placeholder="Escribe un mensaje...";
  }
}

renderHistory();
render();
</script>

</body>
</html>
