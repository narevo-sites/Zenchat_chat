
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ZenChat</title>
<style>
:root {
  --green:#16845b;
  --green-dark:#106b49;
  --orange:#ed9145;
  --text:#202923;
  --muted:#78827c;
  --line:#e9eee9;
  --surface:#f7f9f7;
}
* { box-sizing:border-box; }
body {
  margin:0;
  height:100dvh;
  overflow:hidden;
  background:#fff;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
}
button,textarea { font:inherit; }
button { cursor:pointer; }
.app {
  height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:1000px;
  margin:auto;
  background:white;
}
header {
  height:66px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
  border-bottom:1px solid var(--line);
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:800;
  letter-spacing:-.7px;
}
.brand-mark {
  width:34px;
  height:34px;
  border-radius:11px;
  background:linear-gradient(135deg,var(--orange) 0 48%,var(--green) 49% 100%);
  display:grid;
  place-items:center;
  color:white;
  font-weight:900;
  font-size:17px;
}
.brand span { color:var(--orange); }
.header-actions { display:flex; gap:8px; }
.icon-btn {
  border:1px solid var(--line);
  background:white;
  color:var(--text);
  border-radius:12px;
  width:40px;
  height:40px;
  font-size:19px;
}
.icon-btn:active { background:var(--surface); }
main {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:22px 17px 30px;
  scroll-behavior:smooth;
}
.welcome {
  min-height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px 5px 65px;
}
.welcome-mark {
  width:68px;
  height:68px;
  border-radius:22px;
  display:grid;
  place-items:center;
  color:white;
  font-size:30px;
  font-weight:900;
  background:linear-gradient(135deg,var(--orange) 0 48%,var(--green) 49% 100%);
  box-shadow:0 10px 28px #16845b20;
  margin-bottom:23px;
}
.welcome h1 {
  font-size:clamp(27px,7vw,37px);
  letter-spacing:-1.5px;
  margin:0 0 10px;
}
.welcome h1 span { color:var(--green); }
.welcome p {
  color:var(--muted);
  line-height:1.6;
  max-width:310px;
  margin:0;
  font-size:14px;
}
.suggestions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  width:100%;
  max-width:480px;
  margin-top:30px;
}
.suggestion {
  text-align:left;
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px;
  color:var(--text);
  font-size:13px;
  line-height:1.4;
}
.suggestion:active { border-color:var(--green); }
.messages {
  display:flex;
  flex-direction:column;
  gap:19px;
  max-width:760px;
  margin:0 auto;
}
.message {
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.message.user { justify-content:flex-end; }
.avatar {
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:10px;
  display:grid;
  place-items:center;
  color:white;
  background:var(--green);
  font-size:12px;
  font-weight:800;
}
.bubble {
  max-width:min(84%,650px);
  border-radius:17px;
  padding:12px 15px;
  font-size:14px;
  line-height:1.65;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.assistant .bubble { background:var(--surface); }
.user .bubble {
  color:white;
  background:var(--green);
  border-bottom-right-radius:5px;
}
.typing {
  display:flex;
  gap:5px;
  align-items:center;
  min-height:20px;
}
.typing i {
  width:6px;
  height:6px;
  background:#89958e;
  border-radius:50%;
  animation:dot 1.1s infinite ease-in-out;
}
.typing i:nth-child(2) { animation-delay:.15s; }
.typing i:nth-child(3) { animation-delay:.3s; }
@keyframes dot {
  0%,60%,100% { transform:translateY(0); opacity:.45; }
  30% { transform:translateY(-5px); opacity:1; }
}
.composer-wrap {
  flex-shrink:0;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:#fff;
  border-top:1px solid var(--line);
}
.composer {
  max-width:760px;
  margin:auto;
  border:1px solid #dfe7e0;
  border-radius:19px;
  padding:9px;
  box-shadow:0 5px 22px #1d33200a;
}
#preview {
  display:none;
  padding:5px 7px 10px;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:12px;
}
#preview img {
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:9px;
}
#preview button {
  border:0;
  background:#f1f3f1;
  border-radius:8px;
  padding:5px 9px;
}
textarea {
  display:block;
  width:100%;
  border:0;
  outline:0;
  resize:none;
  min-height:42px;
  max-height:130px;
  padding:10px 9px;
  color:var(--text);
  background:transparent;
  font-size:14px;
  line-height:1.5;
}
.composer-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 2px 0;
}
.tools { display:flex; gap:6px; }
.tool-btn {
  width:36px;
  height:36px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:#68746c;
  font-size:18px;
}
.tool-btn:active { background:var(--surface); }
.send-btn {
  width:39px;
  height:39px;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:white;
  font-size:18px;
  font-weight:700;
}
.send-btn:disabled { opacity:.45; cursor:not-allowed; }
.footer-note {
  text-align:center;
  color:#9aa39d;
  font-size:10px;
  margin:8px 0 0;
}
#fileInput { display:none; }
.history-panel {
  position:fixed;
  inset:0;
  z-index:5;
  background:#0005;
  display:none;
}
.history-panel.open { display:block; }
.drawer {
  width:min(310px,85vw);
  height:100%;
  background:white;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:10px 0 40px #0001;
}
.drawer-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
}
.new-chat {
  border:0;
  background:var(--green);
  color:white;
  border-radius:12px;
  padding:12px;
  font-weight:700;
}
.history-list {
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.history-item {
  border:1px solid var(--line);
  background:white;
  text-align:left;
  border-radius:11px;
  padding:11px;
  color:var(--text);
  font-size:13px;
}
.history-item.active { border-color:var(--green); }
@media(min-width:700px) {
  main { padding:30px 30px; }
  .composer-wrap { padding-left:25px; padding-right:25px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-mark">Z</div>
      Zen<span>Chat</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="historyBtn" aria-label="Historial">☷</button>
      <button class="icon-btn" id="newBtn" aria-label="Nuevo chat">＋</button>
    </div>
  </header>

  <main id="main">
    <section class="welcome" id="welcome">
      <div class="welcome-mark">Z</div>
      <h1>Hola, ¿en qué te <span>ayudo?</span></h1>
      <p>Un espacio para pensar, aprender, crear y resolver tus ideas.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Explícame un tema difícil de forma sencilla.">Aprender algo nuevo</button>
        <button class="suggestion" data-prompt="Ayúdame a crear una idea para un proyecto.">Crear un proyecto</button>
        <button class="suggestion" data-prompt="Ayúdame a resolver un problema paso a paso.">Resolver un problema</button>
        <button class="suggestion" data-prompt="Dame ideas originales para desarrollar.">Buscar inspiración</button>
      </div>
    </section>
    <section class="messages" id="messages" hidden></section>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <div id="preview">
        <img id="previewImg" alt="Imagen adjunta">
        <span>Imagen adjunta</span>
        <button id="removeImage" type="button">Quitar</button>
      </div>
      <textarea id="prompt" rows="1" placeholder="Escribí tu mensaje..."></textarea>
      <div class="composer-bottom">
        <div class="tools">
          <button class="tool-btn" id="attachBtn" aria-label="Adjuntar imagen">＋</button>
        </div>
        <button class="send-btn" id="sendBtn" aria-label="Enviar">↑</button>
      </div>
    </div>
    <p class="footer-note">ZenChat puede cometer errores. Verificá la información importante.</p>
  </div>
</div>

<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp">

<div class="history-panel" id="historyPanel">
  <aside class="drawer">
    <div class="drawer-head">
      <span>Conversaciones</span>
      <button class="icon-btn" id="closeHistory">×</button>
    </div>
    <button class="new-chat" id="drawerNew">＋ Nuevo chat</button>
    <div class="history-list" id="historyList"></div>
  </aside>
</div>

<script>
/*
  IMPORTANTE:
  Esta URL debe ser la dirección de TU backend.
  No pegues una API key aquí.
*/
const API_URL = "https://TU-SERVIDOR.example.com/api/chat";

const $ = (id) => document.getElementById(id);
const promptBox = $("prompt");
const messagesBox = $("messages");
const welcome = $("welcome");
const main = $("main");

let chats = JSON.parse(localStorage.getItem("zenchat_chats") || "[]");
let currentChatId = null;
let selectedImage = null;
let busy = false;

function saveChats() {
  localStorage.setItem("zenchat_chats", JSON.stringify(chats));
}

function currentChat() {
  return chats.find(c => c.id === currentChatId);
}

function createChat() {
  const chat = {
    id: Date.now().toString(),
    title: "Nueva conversación",
    messages: [],
    updated: Date.now()
  };
  chats.unshift(chat);
  currentChatId = chat.id;
  saveChats();
  renderChat();
  renderHistory();
  closeDrawer();
}

function renderChat() {
  const chat = currentChat();
  const hasMessages = !!chat && chat.messages.length > 0;
  welcome.hidden = hasMessages;
  messagesBox.hidden = !hasMessages;
  messagesBox.innerHTML = "";

  if (!hasMessages) return;

  chat.messages.forEach(msg => {
    const row = document.createElement("div");
    row.className = "message " + (msg.role === "user" ? "user" : "assistant");

    if (msg.role !== "user") {
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "Z";
      row.appendChild(avatar);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = msg.text;
    row.appendChild(bubble);
    messagesBox.appendChild(row);
  });

  main.scrollTop = main.scrollHeight;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "message assistant";
  row.id = "typingRow";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "Z";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';

  row.append(avatar, bubble);
  messagesBox.appendChild(row);
  main.scrollTop = main.scrollHeight;
}

function renderHistory() {
  const list = $("historyList");
  list.innerHTML = "";

  chats.forEach(chat => {
    const btn = document.createElement("button");
    btn.className = "history-item" + (chat.id === currentChatId ? " active" : "");
    btn.textContent = chat.title;
    btn.onclick = () => {
      currentChatId = chat.id;
      renderChat();
      renderHistory();
      closeDrawer();
    };
    list.appendChild(btn);
  });
}

function openDrawer() {
  $("historyPanel").classList.add("open");
  renderHistory();
}

function closeDrawer() {
  $("historyPanel").classList.remove("open");
}

function showImage(file) {
  if (!file) return;
  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("Elegí una imagen PNG, JPG o WEBP.");
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    alert("La imagen debe pesar menos de 5 MB.");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    selectedImage = {
      mimeType: file.type,
      data: reader.result.split(",")[1],
      preview: reader.result
    };
    $("previewImg").src = selectedImage.preview;
    $("preview").style.display = "flex";
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  selectedImage = null;
  $("preview").style.display = "none";
  $("fileInput").value = "";
}

async function sendMessage() {
  const text = promptBox.value.trim();
  if (busy || (!text && !selectedImage)) return;

  if (!currentChatId) createChat();
  const chat = currentChat();

  const userText = text || "Analizá esta imagen.";
  const imageToSend = selectedImage
    ? { mimeType: selectedImage.mimeType, data: selectedImage.data }
    : null;

  chat.messages.push({ role: "user", text: userText });
  if (chat.messages.length === 1) {
    chat.title = userText.slice(0, 36) || "Imagen adjunta";
  }
  chat.updated = Date.now();

  promptBox.value = "";
  promptBox.style.height = "42px";
  clearImage();
  renderChat();
  renderHistory();

  busy = true;
  $("sendBtn").disabled = true;
  addTyping();

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: chat.messages.map(m => ({
          role: m.role,
          text: m.text
        })),
        image: imageToSend
      })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.error || "Error del servidor: " + response.status);
    }
    if (!data.reply) throw new Error("El servidor no devolvió una respuesta.");

    chat.messages.push({ role: "assistant", text: data.reply });
  } catch (error) {
    chat.messages.push({
      role: "assistant",
      text: "No pude conectar con ZenChat.\n\n" + error.message +
        "\n\nRevisá la dirección del servidor y su configuración."
    });
  } finally {
    $("typingRow")?.remove();
    busy = false;
    $("sendBtn").disabled = false;
    chat.updated = Date.now();
    saveChats();
    renderChat();
    renderHistory();
  }
}

$("sendBtn").addEventListener("click", sendMessage);
promptBox.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
promptBox.addEventListener("input", () => {
  promptBox.style.height = "42px";
  promptBox.style.height = Math.min(promptBox.scrollHeight, 130) + "px";
});
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => showImage(e.target.files[0]);
$("removeImage").onclick = clearImage;
$("historyBtn").onclick = openDrawer;
$("closeHistory").onclick = closeDrawer;
$("historyPanel").onclick = e => {
  if (e.target === $("historyPanel")) closeDrawer();
};
$("newBtn").onclick = createChat;
$("drawerNew").onclick = createChat;

document.querySelectorAll("[data-prompt]").forEach(btn => {
  btn.addEventListener("click", () => {
    promptBox.value = btn.dataset.prompt;
    promptBox.focus();
  });
});

if (chats.length) {
  currentChatId = chats[0].id;
  renderChat();
} else {
  welcome.hidden = false;
  messagesBox.hidden = true;
}
renderHistory();
</script>
</body>
</html>
