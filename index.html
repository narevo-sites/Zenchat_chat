
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>ZenChat</title>

<style>
:root {
  --green:#147a54;
  --green-dark:#0d6041;
  --orange:#e58a3a;
  --bg:#f7f8f7;
  --text:#202820;
  --muted:#7b857e;
  --border:#e5e9e6;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100dvh;
  overflow:hidden;
}

button,textarea,input {font:inherit;}

.app {
  height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:1000px;
  margin:auto;
  background:white;
}

header {
  min-height:65px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid var(--border);
  gap:8px;
}

.logo {
  font-size:23px;
  font-weight:800;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span:first-child {color:var(--green);}
.logo span:last-child {color:var(--orange);}

.header-actions {
  display:flex;
  align-items:center;
  gap:6px;
}

.small-btn {
  border:1px solid var(--border);
  background:white;
  padding:9px 10px;
  border-radius:10px;
  cursor:pointer;
  color:var(--text);
  font-size:13px;
}

.small-btn:active {background:#f1f4f1;}

.close-chat {
  width:36px;
  height:36px;
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  font-size:22px;
  color:#777;
  cursor:pointer;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:22px 17px;
  display:flex;
  flex-direction:column;
  gap:18px;
  scroll-behavior:smooth;
}

.welcome {
  margin:auto;
  text-align:center;
  max-width:420px;
  padding:20px;
}

.welcome h1 {
  font-size:29px;
  margin-bottom:10px;
}

.welcome h1 span {color:var(--green);}

.welcome p {
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.suggestions {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:22px;
}

.suggestion {
  border:1px solid var(--border);
  background:white;
  border-radius:20px;
  padding:10px 13px;
  font-size:13px;
  cursor:pointer;
}

.message {
  max-width:85%;
  padding:13px 15px;
  border-radius:16px;
  line-height:1.55;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user {
  align-self:flex-end;
  background:var(--green);
  color:white;
  border-bottom-right-radius:4px;
}

.bot {
  align-self:flex-start;
  background:#f1f4f1;
  color:var(--text);
  border-bottom-left-radius:4px;
}

.typing {
  display:flex;
  gap:5px;
  padding:15px;
  background:#f1f4f1;
  border-radius:15px;
  width:max-content;
}

.typing i {
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
  animation:blink 1s infinite;
}

.typing i:nth-child(2) {animation-delay:.15s;}
.typing i:nth-child(3) {animation-delay:.3s;}

@keyframes blink {
  0%,80%,100% {opacity:.3;transform:translateY(0);}
  40% {opacity:1;transform:translateY(-4px);}
}

.composer {
  padding:12px 15px max(12px,env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  background:white;
}

.input-box {
  display:flex;
  align-items:flex-end;
  gap:9px;
  border:1px solid #dce3dd;
  border-radius:17px;
  padding:9px;
}

#prompt {
  flex:1;
  resize:none;
  border:none;
  outline:none;
  min-height:38px;
  max-height:120px;
  padding:9px 5px;
  font-size:15px;
}

#send {
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-size:20px;
  cursor:pointer;
}

#send:disabled {opacity:.5;}

.footer {
  text-align:center;
  font-size:11px;
  color:#929a94;
  margin-top:8px;
}

/* VENTANA API KEY */

.overlay {
  position:fixed;
  inset:0;
  background:rgba(12,20,15,.60);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.overlay.active {display:flex;}

.modal {
  width:100%;
  max-width:390px;
  background:white;
  border-radius:20px;
  padding:24px;
  box-shadow:0 20px 70px rgba(0,0,0,.2);
  animation:appear .2s ease;
}

@keyframes appear {
  from {opacity:0;transform:translateY(12px);}
  to {opacity:1;transform:translateY(0);}
}

.modal h2 {
  font-size:23px;
  margin-bottom:10px;
}

.modal p {
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:18px;
}

#apiInput {
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
  margin-bottom:12px;
}

#apiInput:focus {border-color:var(--green);}

#connect {
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:var(--green);
  color:white;
  font-weight:700;
  cursor:pointer;
}

#connect:disabled {opacity:.6;}

#cancelKey {
  width:100%;
  margin-top:9px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:11px;
  background:white;
  cursor:pointer;
  display:none;
}

#keyStatus {
  font-size:13px;
  margin-top:13px;
  line-height:1.5;
  color:var(--muted);
  overflow-wrap:anywhere;
}

.modal a {
  color:var(--green);
  text-decoration:none;
}

@media(max-width:390px) {
  .logo {font-size:19px;}
  .small-btn {font-size:11px;padding:9px 7px;}
  .header-actions {gap:4px;}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    <span>Zen</span><span>Chat</span>
  </div>

  <div class="header-actions">
    <button class="small-btn" id="changeKey">API_KEY</button>
    <button class="small-btn" id="newChat">Nuevo chat</button>
    <button class="close-chat" id="closeChat" aria-label="Cerrar chat">×</button>
  </div>
</header>

<main id="messages"></main>

<div class="composer">
  <div class="input-box">
    <textarea id="prompt"
      placeholder="Escribí tu mensaje..."
      rows="1"></textarea>
    <button id="send" aria-label="Enviar">↑</button>
  </div>
  <div class="footer">ZenChat · Inteligencia artificial</div>
</div>

</div>

<!-- MODAL API KEY -->

<div class="overlay" id="keyModal">
  <div class="modal">

    <h2>Configurar ZenChat</h2>

    <p>
      Conectá tu cuenta de Gemini.
      Pegá tu API Key para activar la inteligencia artificial.
    </p>

    <input
      id="apiInput"
      type="password"
      placeholder="Pegá tu API Key aquí"
      autocomplete="off"
    >

    <button id="connect">Enter</button>

    <button id="cancelKey">Cancelar</button>

    <div id="keyStatus"></div>

    <p style="margin-top:15px;margin-bottom:0">
      ¿No tenés una clave?
      <a href="https://aistudio.google.com/apikey"
         target="_blank"
         rel="noopener">
        Conseguir API Key
      </a>
    </p>

  </div>
</div>

<script>
"use strict";

/* CONFIGURACIÓN GEMINI */

const MODEL = "gemini-3.8-flash";

const API_URL =
  "https://generativelanguage.googleapis.com/v1beta/models/" +
  MODEL + ":generateContent";

const $ = id => document.getElementById(id);

const messages = $("messages");
const prompt = $("prompt");
const modal = $("keyModal");
const apiInput = $("apiInput");
const keyStatus = $("keyStatus");

let apiKey = "";
let conversation = [];
let busy = false;
let changingKey = false;

/* INTERFAZ */

function showWelcome() {
  messages.innerHTML = `
    <section class="welcome" id="welcome">
      <h1>¿En qué puedo <span>ayudarte?</span></h1>
      <p>
        Tu espacio de conversación inteligente.
        Preguntá, aprendé y explorá nuevas ideas.
      </p>

      <div class="suggestions">
        <button class="suggestion"
          data-text="Explicame cómo funciona la inteligencia artificial.">
          Inteligencia artificial
        </button>

        <button class="suggestion"
          data-text="Ayudame a aprender programación desde cero.">
          Aprender programación
        </button>

        <button class="suggestion"
          data-text="Dame una idea creativa para un proyecto.">
          Ideas creativas
        </button>
      </div>
    </section>
  `;

  attachSuggestions();
}

function addMessage(text,type) {
  const element = document.createElement("div");

  element.className = "message " + type;
  element.textContent = text;

  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;
}

function showTyping() {
  const element = document.createElement("div");

  element.className = "typing";
  element.id = "typingIndicator";
  element.innerHTML = "<i></i><i></i><i></i>";

  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  const element = $("typingIndicator");
  if(element) element.remove();
}

/* ABRIR VENTANA API_KEY */

function openKeyModal() {
  changingKey = Boolean(apiKey);

  apiInput.value = "";
  keyStatus.textContent = "";

  $("cancelKey").style.display =
    changingKey ? "block" : "none";

  $("connect").textContent = "Enter";

  modal.classList.add("active");

  setTimeout(() => apiInput.focus(),150);
}

function closeKeyModal() {
  if(!apiKey) return;

  modal.classList.remove("active");
  apiInput.value = "";
  keyStatus.textContent = "";
}

/* CONECTAR API KEY */

async function connectKey() {
  const newKey = apiInput.value.trim();

  if(!newKey) {
    keyStatus.textContent = "Pegá tu API Key primero.";
    return;
  }

  const button = $("connect");

  button.disabled = true;
  keyStatus.textContent = "Comprobando conexión...";

  try {
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-goog-api-key":newKey
      },
      body:JSON.stringify({
        contents:[{
          role:"user",
          parts:[{
            text:"Respondé solamente: Conexión correcta."
          }]
        }],
        generationConfig:{
          maxOutputTokens:30
        }
      })
    });

    const data = await response.json();

    if(!response.ok) {
      throw new Error(
        data.error?.message || "No se pudo conectar."
      );
    }

    apiKey = newKey;

    try {
      localStorage.setItem("zenchat_api_key",apiKey);
    } catch(error) {
      throw new Error(
        "El navegador no permitió guardar la clave. Revisá su configuración."
      );
    }

    modal.classList.remove("active");
    apiInput.value = "";
    keyStatus.textContent = "";

    if(!changingKey) {
      conversation = [];
      showWelcome();
    }

  } catch(error) {
    keyStatus.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
  }
}

/* SOLICITUD A GEMINI */

async function askGemini(text) {
  if(!apiKey || busy) return;

  busy = true;
  $("send").disabled = true;
  $("newChat").disabled = true;
  $("closeChat").disabled = true;

  addMessage(text,"user");

  conversation.push({
    role:"user",
    parts:[{text}]
  });

  showTyping();

  try {
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-goog-api-key":apiKey
      },
      body:JSON.stringify({
        contents:conversation,
        generationConfig:{
          temperature:0.8,
          maxOutputTokens:2048
        }
      })
    });

    const data = await response.json();

    if(!response.ok) {
      throw new Error(
        data.error?.message || "Error de conexión."
      );
    }

    const answer = data.candidates?.[0]?.content?.parts
      ?.map(part => part.text || "")
      .join("");

    if(!answer) {
      throw new Error("Gemini no devolvió una respuesta.");
    }

    conversation.push({
      role:"model",
      parts:[{text:answer}]
    });

    removeTyping();
    addMessage(answer,"bot");

  } catch(error) {
    removeTyping();
    conversation.pop();

    addMessage(
      "No pude conectar con Gemini: " + error.message,
      "bot"
    );

  } finally {
    busy = false;
    $("send").disabled = false;
    $("newChat").disabled = false;
    $("closeChat").disabled = false;
    prompt.focus();
  }
}

/* ENVIAR */

function send() {
  if(busy) return;

  const text = prompt.value.trim();
  if(!text) return;

  if(!apiKey) {
    openKeyModal();
    return;
  }

  prompt.value = "";
  prompt.style.height = "38px";

  askGemini(text);
}

/* NUEVO CHAT */

function newChat() {
  if(busy) return;

  conversation = [];
  prompt.value = "";
  prompt.style.height = "38px";

  showWelcome();
}

/* CERRAR CHAT */

function closeChat() {
  if(busy) return;

  conversation = [];
  prompt.value = "";
  prompt.style.height = "38px";

  showWelcome();
  prompt.blur();
}

/* SUGERENCIAS */

function attachSuggestions() {
  document.querySelectorAll(".suggestion").forEach(button => {
    button.addEventListener("click",() => {
      prompt.value = button.dataset.text;
      send();
    });
  });
}

/* INICIALIZACIÓN */

function initialize() {
  showWelcome();

  try {
    const savedKey =
      localStorage.getItem("zenchat_api_key");

    if(savedKey) {
      apiKey = savedKey;
    } else {
      openKeyModal();
    }
  } catch(error) {
    openKeyModal();
  }
}

/* EVENTOS */

$("changeKey").addEventListener("click",openKeyModal);

$("connect").addEventListener("click",connectKey);

$("cancelKey").addEventListener("click",closeKeyModal);

$("newChat").addEventListener("click",newChat);

$("closeChat").addEventListener("click",closeChat);

$("send").addEventListener("click",send);

apiInput.addEventListener("keydown",event => {
  if(event.key === "Enter") {
    event.preventDefault();
    connectKey();
  }
});

prompt.addEventListener("keydown",event => {
  if(event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});

prompt.addEventListener("input",() => {
  prompt.style.height = "38px";
  prompt.style.height =
    Math.min(prompt.scrollHeight,120) + "px";
});

initialize();

</script>

</body>
</html>
