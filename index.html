<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenChat</title>

<style>
:root {
  --green:#147a54;
  --orange:#e58a3a;
  --bg:#f7f8f7;
  --white:#fff;
  --text:#202820;
  --muted:#7b857e;
  --border:#e5e9e6;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100dvh;
  overflow:hidden;
}

button,textarea {
  font:inherit;
}

.app {
  height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:1000px;
  margin:auto;
  background:white;
}

header {
  height:65px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--border);
}

.logo {
  font-size:23px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span:first-child {color:var(--green);}
.logo span:last-child {color:var(--orange);}

.small-btn {
  border:1px solid var(--border);
  background:white;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:22px 17px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.welcome {
  margin:auto;
  text-align:center;
  max-width:420px;
  padding:20px;
}

.welcome h1 {
  font-size:29px;
  margin-bottom:10px;
}

.welcome h1 span {color:var(--green);}

.welcome p {
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.suggestions {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:22px;
}

.suggestion {
  border:1px solid var(--border);
  background:white;
  border-radius:20px;
  padding:10px 13px;
  font-size:13px;
  cursor:pointer;
}

.message {
  max-width:85%;
  padding:13px 15px;
  border-radius:16px;
  line-height:1.55;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user {
  align-self:flex-end;
  background:var(--green);
  color:white;
  border-bottom-right-radius:4px;
}

.bot {
  align-self:flex-start;
  background:#f1f4f1;
  color:var(--text);
  border-bottom-left-radius:4px;
}

.typing {
  display:flex;
  gap:5px;
  padding:15px;
  background:#f1f4f1;
  border-radius:15px;
  width:max-content;
}

.typing i {
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
  animation:blink 1s infinite;
}

.typing i:nth-child(2) {animation-delay:.15s;}
.typing i:nth-child(3) {animation-delay:.3s;}

@keyframes blink {
  0%,80%,100% {opacity:.3;transform:translateY(0);}
  40% {opacity:1;transform:translateY(-4px);}
}

.composer {
  padding:12px 15px max(12px,env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  background:white;
}

.input-box {
  display:flex;
  align-items:flex-end;
  gap:9px;
  border:1px solid #dce3dd;
  border-radius:17px;
  padding:9px;
}

#prompt {
  flex:1;
  resize:none;
  border:none;
  outline:none;
  min-height:38px;
  max-height:120px;
  padding:9px 5px;
  font-size:15px;
}

#send {
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-size:20px;
  cursor:pointer;
}

#send:disabled {opacity:.5;}

.footer {
  text-align:center;
  font-size:11px;
  color:#929a94;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    <span>Zen</span><span>Chat</span>
  </div>

  <button class="small-btn" id="newChat">Nuevo chat</button>
</header>

<main id="messages">

<section class="welcome" id="welcome">
  <h1>¿En qué puedo <span>ayudarte?</span></h1>
  <p>Tu espacio de conversación inteligente. Preguntá, aprendé y explorá nuevas ideas.</p>

  <div class="suggestions">
    <button class="suggestion" data-text="Explicame cómo funciona la inteligencia artificial.">Inteligencia artificial</button>
    <button class="suggestion" data-text="Ayudame a aprender programación desde cero.">Aprender programación</button>
    <button class="suggestion" data-text="Dame una idea creativa para un proyecto.">Ideas creativas</button>
  </div>
</section>

</main>

<div class="composer">
  <div class="input-box">
    <textarea id="prompt" placeholder="Escribí tu mensaje..." rows="1"></textarea>
    <button id="send" aria-label="Enviar">↑</button>
  </div>
  <div class="footer">ZenChat · Inteligencia artificial</div>
</div>

</div>

<script>
"use strict";

/* =================================
   CONFIGURACIÓN DE ZENCHAT
   PEGÁ TU API KEY SOLAMENTE AQUÍ
================================= */

const API_KEY = "PEGA_TU_API_KEY_AQUI";
const MODEL = "gemini-2.5-flash";

/* ================================= */

const $ = id => document.getElementById(id);

const messages = $("messages");
const prompt = $("prompt");
const sendButton = $("send");

let conversation = [];
let busy = false;

function addMessage(text,type) {
  const welcome = $("welcome");
  if(welcome) welcome.remove();

  const element = document.createElement("div");
  element.className = "message " + type;
  element.textContent = text;

  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;
}

function showTyping() {
  const element = document.createElement("div");
  element.className = "typing";
  element.id = "typingIndicator";
  element.innerHTML = "<i></i><i></i><i></i>";

  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  const element = $("typingIndicator");
  if(element) element.remove();
}

async function askGemini(text) {

  if(!API_KEY || API_KEY === "PEGA_TU_API_KEY_AQUI") {
    addMessage("Configurá tu API Key en la línea API_KEY del código.", "bot");
    return;
  }

  busy = true;
  sendButton.disabled = true;

  addMessage(text,"user");

  conversation.push({
    role:"user",
    parts:[{text:text}]
  });

  showTyping();

  try {

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-goog-api-key":API_KEY
        },
        body:JSON.stringify({
          contents:conversation,
          generationConfig:{
            temperature:0.8,
            maxOutputTokens:2048
          }
        })
      }
    );

    const data = await response.json();

    if(!response.ok) {
      throw new Error(data.error?.message || "Error de conexión con Gemini.");
    }

    const answer = data.candidates?.[0]?.content?.parts
      ?.map(part => part.text || "")
      .join("") || "No recibí una respuesta.";

    conversation.push({
      role:"model",
      parts:[{text:answer}]
    });

    removeTyping();
    addMessage(answer,"bot");

  } catch(error) {

    removeTyping();

    conversation.pop();

    addMessage("No pude conectar con Gemini: " + error.message,"bot");

  } finally {

    busy = false;
    sendButton.disabled = false;
    prompt.focus();

  }
}

function send() {

  if(busy) return;

  const text = prompt.value.trim();
  if(!text) return;

  prompt.value = "";
  prompt.style.height = "38px";

  askGemini(text);
}

function newChat() {

  conversation = [];
  messages.innerHTML = "";

  const welcome = document.createElement("section");
  welcome.className = "welcome";
  welcome.id = "welcome";

  welcome.innerHTML = `
    <h1>¿En qué puedo <span>ayudarte?</span></h1>
    <p>Tu espacio de conversación inteligente. Preguntá, aprendé y explorá nuevas ideas.</p>
  `;

  messages.appendChild(welcome);
  prompt.value = "";
}

sendButton.addEventListener("click",send);

prompt.addEventListener("keydown",event => {
  if(event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});

prompt.addEventListener("input",() => {
  prompt.style.height = "38px";
  prompt.style.height = Math.min(prompt.scrollHeight,120) + "px";
});

$("newChat").addEventListener("click",newChat);

document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click",() => {
    prompt.value = button.dataset.text;
    send();
  });
});

</script>

</body>
</html>
