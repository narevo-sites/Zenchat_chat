<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090c">
<title>ZC AI</title>

<style>
:root {
  --bg: #08090c;
  --panel: #101116;
  --border: #25232c;
  --text: #f5f5f7;
  --muted: #898894;
  --orange: #ff7a18;
  --green: #39e75f;
  --purple: #a855f7;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button, textarea {
  font: inherit;
}

header {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}

.logo-small {
  width: 39px;
  height: 39px;
  object-fit: contain;
}

.brand {
  font-weight: 750;
  font-size: 19px;
  letter-spacing: -0.7px;
}

.brand span:first-child {
  color: var(--orange);
}

.brand span:last-child {
  color: var(--green);
}

.header-actions {
  margin-left: auto;
}

button {
  cursor: pointer;
  border: 0;
}

.icon-btn {
  background: transparent;
  color: var(--text);
  padding: 10px;
  border-radius: 12px;
}

.icon-btn:hover {
  background: #202027;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px 18px;
  scroll-behavior: smooth;
}

.welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-bottom: 30px;
}

.logo-large {
  width: 145px;
  height: 145px;
  object-fit: contain;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 20px #8b35ff22);
}

.welcome h1 {
  font-size: clamp(28px, 7vw, 43px);
  letter-spacing: -1.8px;
  margin: 0;
}

.welcome h1 span {
  background: linear-gradient(90deg, var(--orange), var(--purple), var(--green));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: var(--muted);
  font-size: 14px;
  margin-top: 12px;
}

.messages {
  max-width: 760px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.message {
  line-height: 1.7;
  font-size: 15px;
  overflow-wrap: anywhere;
}

.message.user {
  align-self: flex-end;
  max-width: 85%;
  background: #1b1921;
  border: 1px solid #302936;
  padding: 12px 16px;
  border-radius: 18px 18px 5px 18px;
}

.message.ai {
  align-self: stretch;
  white-space: pre-wrap;
}

.message.ai strong {
  color: white;
}

.typing {
  display: flex;
  gap: 5px;
  padding: 10px 0;
}

.typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--purple);
  animation: pulse 1s infinite alternate;
}

.typing span:nth-child(2) {
  animation-delay: .2s;
}

.typing span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes pulse {
  from { opacity: .25; transform: translateY(0); }
  to { opacity: 1; transform: translateY(-4px); }
}

.composer-area {
  padding: 12px 15px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--bg) 25%);
}

.composer {
  max-width: 760px;
  margin: auto;
  border: 1px solid #34303d;
  background: #121116;
  border-radius: 23px;
  padding: 12px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  box-shadow: 0 8px 35px #0005;
}

textarea {
  flex: 1;
  resize: none;
  outline: none;
  border: none;
  background: transparent;
  color: white;
  padding: 8px;
  max-height: 140px;
  min-height: 40px;
}

textarea::placeholder {
  color: #77737f;
}

.send {
  width: 42px;
  height: 42px;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--orange), var(--purple));
  color: white;
  font-size: 19px;
  font-weight: bold;
  flex-shrink: 0;
}

.send:disabled {
  opacity: .4;
}

.footer {
  text-align: center;
  color: #65616d;
  font-size: 11px;
  padding-top: 10px;
}

#sidebar {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #09090c;
  padding: 20px;
  transform: translateX(-100%);
  transition: transform .25s;
  width: min(310px, 85vw);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

#sidebar.open {
  transform: translateX(0);
}

.side-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
}

.new-chat {
  background: #1a171f;
  color: white;
  padding: 13px;
  border-radius: 13px;
  border: 1px solid #34303c;
  text-align: left;
}

.history {
  margin-top: 25px;
  color: var(--muted);
  font-size: 13px;
}

#overlay {
  position: fixed;
  inset: 0;
  background: #0009;
  display: none;
  z-index: 9;
}

#overlay.show {
  display: block;
}

@media (min-width: 700px) {
  #chat {
    padding: 35px;
  }
}
</style>
</head>

<body>

<header>
  <button class="icon-btn" onclick="toggleSidebar()">☰</button>

  <img src="logo.png" class="logo-small" alt="ZC">

  <div class="brand">
    <span>Z</span><span>C</span> AI
  </div>

  <div class="header-actions">
    <button class="icon-btn" onclick="newChat()">＋</button>
  </div>
</header>

<div id="sidebar">
  <div class="side-title">
    <strong>Conversaciones</strong>
    <button class="icon-btn" onclick="toggleSidebar()">✕</button>
  </div>

  <button class="new-chat" onclick="newChat()">＋ Nuevo chat</button>

  <div class="history">Historial local</div>
  <div id="historyList"></div>
</div>

<div id="overlay" onclick="toggleSidebar()"></div>

<main id="chat">
  <section class="welcome" id="welcome">
    <img src="logo.png" class="logo-large" alt="ZC AI">

    <h1>Hola, soy <span>ZC AI</span></h1>

    <p>Tu inteligencia artificial, en un espacio diferente.</p>
  </section>

  <div class="messages" id="messages"></div>
</main>

<div class="composer-area">
  <form class="composer" id="form">
    <textarea id="input" placeholder="Escribí tu mensaje..." rows="1"></textarea>
    <button class="send" id="send" type="submit">↑</button>
  </form>

  <div class="footer">ZC AI · Inteligencia artificial</div>
</div>

<script>
const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";
const API_KEY "AQ.Ab8RN6K2b-Um0g8LyXYalDrtiMqSA5J2aKxrtR3mYhQj8HCeDA";

const chat = document.getElementById("chat");
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const form = document.getElementById("form");
const send = document.getElementById("send");
const welcome = document.getElementById("welcome");

let conversation = [];
let chats = JSON.parse(localStorage.getItem("zc_chats") || "[]");

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function saveChats() {
  localStorage.setItem("zc_chats", JSON.stringify(chats));
}

function newChat() {
  conversation = [];
  messages.innerHTML = "";
  welcome.style.display = "flex";
  toggleSidebarIfOpen();
}

function toggleSidebarIfOpen() {
  if (document.getElementById("sidebar").classList.contains("open")) {
    toggleSidebar();
  }
}

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = "message " + role;
  el.textContent = text;
  messages.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function showTyping() {
  const el = document.createElement("div");
  el.className = "message ai typing";
  el.innerHTML = "<span></span><span></span><span></span>";
  messages.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const prompt = input.value.trim();
  if (!prompt || send.disabled) return;

  welcome.style.display = "none";
  addMessage("user", prompt);

  conversation.push({ role: "user", content: prompt });

  input.value = "";
  input.style.height = "40px";
  send.disabled = true;

  const typing = showTyping();

  try {
    if (!API_URL) {
      throw new Error("Falta configurar el backend de IA.");
    }

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(API_KEY ? { "Authorization": "Bearer " + API_KEY } : {})
      },
      body: JSON.stringify({
        messages: conversation
      })
    });

    if (!response.ok) throw new Error("Error HTTP " + response.status);

    const data = await response.json();

    const answer = data.choices?.[0]?.message?.content
      || data.answer
      || data.response
      || "No se recibió una respuesta.";

    typing.remove();
    addMessage("ai", answer);
    conversation.push({ role: "assistant", content: answer });

    chats.unshift({
      title: prompt.slice(0, 40),
      messages: conversation
    });

    chats = chats.slice(0, 30);
    saveChats();
    renderHistory();

  } catch (err) {
    typing.remove();
    addMessage("ai", "No se pudo conectar con la IA. Configurá API_URL y el backend.");
    console.error(err);
  }

  send.disabled = false;
  input.focus();
});

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  chats.forEach((item, index) => {
    const btn = document.createElement("button");
    btn.className = "new-chat";
    btn.style.marginTop = "8px";
    btn.style.width = "100%";
    btn.textContent = item.title;
    btn.onclick = () => {
      conversation = [...item.messages];
      messages.innerHTML = "";
      welcome.style.display = "none";

      conversation.forEach(m => {
        addMessage(m.role === "user" ? "user" : "ai", m.content);
      });

      toggleSidebarIfOpen();
    };
    list.appendChild(btn);
  });
}

renderHistory();
</script>

</body>
</html>
