<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>ZenChat</title>\n<style>\n:root{--g:#147a54;--g2:#0d6041;--o:#e58a3a;--ink:#1d2822;--muted:#7b857e;--line:#e7ece8;--bg:#f9fbf9}\n*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-s\nerif;background:var(--bg);color:var(--ink)}\nbody{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}\nheader{height:70px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1\npx solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(16px)}\n.brand{font-size:24px;font-weight:800;letter-spacing:-1.2px}.zen{color:var(--o)}.chat{color:var(--g)}\n.iconbtn,.pillbtn{border:1px solid var(--line);background:white;color:#34423a;border-radius:14px;cursor:pointer;font:inherit;\ntransition:all .18s ease}.iconbtn{width:42px;height:42px;font-size:19px}.pillbtn{padding:10px 13px;font-size:13px;font-weight\n:650}\nmain{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:22px 18px 12px}\n.welcome{margin:auto;text-align:center;max-width:660px;padding:30px 0}.welcome h1{font-size:clamp(30px,6vw,46px);letter-spaci\nng:-1.8px;margin:0 0 12px;font-weight:760}.welcome h1 span{color:var(--g)}.welcome p{color:var(--muted);font-size:15px;margin\n:0 0 26px}\n.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.suggestions button:hover{border-color:#c7ddce;backgr\nound:#f5faf6;color:var(--g)}.suggestions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px\n 17px;color:#455249;cursor:pointer;font-size:13px;transition:all .2s}\n.messages{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}.msg{max-width:90%;padding:14p\nx 16px;border-radius:20px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#e\ndf6f0;border:1px solid #dcebe1}.assistant{align-self:flex-start;background:white;border:1px solid var(--line);box-shadow:0 3p\nx 14px #172d1a05}.typing{color:var(--muted);display:flex;gap:6px;align-items:center}.dot{width:5px;height:5px;background:var(\n--g);border-radius:50%;animation:pulse .75s infinite alternate}.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){anima\ntion-delay:.36s}@keyframes pulse{to{opacity:.2;transform:translateY(-3px)}}\n.composerWrap{padding:10px 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 25%);f\nlex-shrink:0}.composer{max-width:850px;margin:auto;background:white;border:1px solid #e2e9e3;border-radius:26px;box-shadow:0 \n12px 36px rgba(24,59,37,.07);padding:12px;display:flex;border-color:#e1e9e2;flex-direction:column;gap:8px}.tools{display:flex\n;align-items:center;gap:7px}.tool{border:0;background:#f5f8f5;color:#58645b;border-radius:10px;padding:8px 11px;cursor:pointe\nr;font-size:13px}.inputrow{display:flex;align-items:flex-end;gap:8px}.inputrow textarea{flex:1;resize:none;border:0;outline:0\n;background:transparent;font:inherit;font-size:16px;line-height:1.4;max-height:150px;min-height:42px;padding:10px 8px}.send{w\nidth:44px;height:44px;border:0;border-radius:15px;background:var(--g);color:white;font-size:21px;cursor:pointer}.send:disable\nd{opacity:.45}.send{font-size:13px;font-weight:700;padding:0 8px;width:auto;min-width:58px}.tool:hover,.pillbtn:hover,.iconbt\nn:hover{background:#f5faf6;border-color:#d3e4d8}.hint{text-align:center;color:#9aa39c;font-size:11px;margin:8px 0 0}\n.side{position:fixed;inset:0;background:#0004;z-index:5;display:none}.side.open{display:block}.drawer{height:100%;width:min(3\n00px,85vw);background:white;padding:20px;box-shadow:12px 0 40px #0001}.drawerhead{display:flex;justify-content:space-between;\nalign-items:center;margin-bottom:18px}.newchat{width:100%;padding:13px;border:1px solid #dce8df;background:#f4faf6;color:var(\n--g);border-radius:13px;font-weight:650;cursor:pointer}.history{margin-top:15px;display:flex;flex-direction:column;gap:7px}.h\nistory button{border:0;background:#f8faf8;padding:12px;border-radius:11px;text-align:left;color:#49544c;cursor:pointer;overfl\now:hidden;text-overflow:ellipsis;white-space:nowrap}\n#preview{display:none;color:var(--g);font-size:12px;padding-left:4px}\n@media(min-width:700px){header{padding:0 28px}main{padding:30px 28px 15px}.composerWrap{padding-left:28px;padding-right:28px}\n}\n</style></head>\n<body><div class="app">\n<header><button class="iconbtn" id="menu" aria-label="Historial">≡</button><div class="brand"><span class="zen">Zen</span><sp\nan class="chat">Chat</span></div><button class="pillbtn" id="imageMode">Crear imagen</button></header>\n<main id="main"><section class="welcome" id="welcome"><h1>¿En qué puedo <span>ayudarte?</span></h1><p>Ideas, respuestas y cre\natividad en un solo lugar.</p><div class="suggestions"><button data-prompt="Explícame un tema paso a paso">Aprender algo</but\nton><button data-prompt="Dame ideas creativas para un proyecto">Crear ideas</button><button data-prompt="Ayúdame a resolver e\nste problema">Resolver algo</button></div></section><div class="messages" id="messages"></div></main>\n<div class="composerWrap"><div class="composer"><div class="tools"><button class="tool" id="format"><b>*</b> Formato</button>\n<button class="tool" id="attach">Adjuntar imagen</button><span id="preview"></span><input type="file" id="file" accept="image\n/*" hidden></div><div class="inputrow"><textarea id="prompt" rows="1" placeholder="Escribe un mensaje..."></textarea><button \nclass="send" id="send" aria-label="Enviar">Enviar</button></div></div><p class="hint">ZenChat puede cometer errores. Verifica\n la información importante.</p></div></div>\n<div class="side" id="side"><div class="drawer"><div class="drawerhead"><b>Conversaciones</b><button class="iconbtn" id="clos\neSide">✕</button></div><button class="newchat" id="newchat">+ Nuevo chat</button><div class="history" id="history"></div></di\nv></div>\n<script>\n/* Pega tu clave de Gemini aquí. No publiques una API key real en un repositorio público. */\nconst API_KEY = "PEGAR_API_KEY_AQUI";\nconst MODEL = "gemini-2.5-flash";\nconst $ = id => document.getElementById(id);\nlet chats = JSON.parse(localStorage.getItem("zenchat_chats") || "[]"), current = null, attached = null, imageMode = false, bu\nsy = false;\nfunction save(){localStorage.setItem("zenchat_chats",JSON.stringify(chats));renderHistory()}\nfunction newChat(){current={id:Date.now(),title:"Nuevo chat",messages:[]};chats.unshift(current);save();render();$("side").cl\nassList.remove("open")}\nfunction ensure(){if(!current){current={id:Date.now(),title:"Nuevo chat",messages:[]};chats.unshift(current)}}\nfunction render(){const box=$("messages");box.innerHTML="";$("welcome").style.display=current&&current.messages.length?"none"\n:"block";if(current)current.messages.forEach(m=>{let d=document.createElement("div");d.className="msg "+(m.role==="user"?"use\nr":"assistant");d.textContent=m.text;box.appendChild(d)});$("main").scrollTop=$("main").scrollHeight}\nfunction renderHistory(){let h=$("history");h.innerHTML="";chats.forEach(c=>{let b=document.createElement("button");b.textCon\ntent=c.title||"Chat";b.onclick=()=>{current=c;render();$("side").classList.remove("open")};h.appendChild(b)})}\nfunction addMsg(role,text){current.messages.push({role,text});if(current.title==="Nuevo chat"&&role==="user")current.title=te\nxt.slice(0,35);save();render()}\nfunction typing(){let d=document.createElement("div");d.className="msg assistant typing";d.id="typing";d.innerHTML='<span>Zen\nChat está respondiendo</span><i class="dot"></i><i class="dot"></i><i class="dot"></i>';$("messages").appendChild(d);$("main"\n).scrollTop=$("main").scrollHeight}\n$("format").onclick=()=>{let t=$("prompt"),a=t.selectionStart,b=t.selectionEnd,s=t.value;t.value=s.slice(0,a)+"**"+s.slice(a,\nb||a)+"**"+s.slice(b);t.focus();t.setSelectionRange(a+2,b+2)};\n$("menu").onclick=()=>$("side").classList.add("open");$("closeSide").onclick=()=>$("side").classList.remove("open");$("side")\n.onclick=e=>{if(e.target===$("side"))$("side").classList.remove("open")};$("newchat").onclick=newChat;\n$("attach").onclick=()=>$("file").click();$("file").onchange=e=>{attached=e.target.files[0];$("preview").style.display="inlin\ne";$("preview").textContent=attached?"Imagen: "+attached.name:""};\n$("imageMode").onclick=()=>{imageMode=!imageMode;$("imageMode").style.background=imageMode?"#eaf5ef":"white";$("prompt").plac\neholder=imageMode?"Describe la imagen que quieres crear...":"Escribe un mensaje..."};\ndocument.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{$("prompt").value=b.dataset.prompt;send()});\n$("prompt").addEventListener("input",()=>{$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrol\nlHeight,150)+"px"});\n$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});\n$("send").onclick=send;\nasync function send(){\n if(busy)return;let text=$("prompt").value.trim();if(!text&&!attached)return;\n if(API_KEY==="PEGAR_API_KEY_AQUI"){alert("Pega tu API key en la constante API_KEY del código.");return}\n ensure();let file=attached;addMsg("user",text+(file?" [Imagen adjunta]":""));$("prompt").value="";$("prompt").style.height="\nauto";attached=null;$("preview").style.display="none";$("file").value="";\n busy=true;$("send").disabled=true;typing();\n try{\n let parts=[{text:imageMode?"Genera una imagen basada en esta solicitud: "+text:text}];\n if(file){let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=r\nej;r.readAsDataURL(file)});parts.push({inline_data:{mime_type:file.type,data}})}\n let prior=current.messages.slice(0,-1).map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.text}]}));\n let response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,\n{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[...prior,{role:"user",parts}],gener\nationConfig:{temperature:.7}})});\n let data=await response.json();if(!response.ok)throw Error(data.error?.message||"Error de API");\n let answer=data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"No recibí una respuesta.";\n $("typing")?.remove();addMsg("assistant",answer);\n }catch(err){$("typing")?.remove();addMsg("assistant","Error: "+err.message)}\n finally{busy=false;$("send").disabled=false;imageMode=false;$("imageMode").style.background="white";$("prompt").placeholder=\n"Escribe un mensaje..."}\n}\nrenderHistory();render();\n</script></body></html>o
